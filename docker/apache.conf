# Sitio de la tienda. La raíz pública es /public: app/, database/, storage/ y herramientas/ quedan afuera.
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Fotos subidas desde el panel: solo se sirven imágenes y nunca se ejecuta PHP.
    # Se niega todo archivo cuya última extensión no sea de imagen (x.php, y.webp.php, web.config...).
    <Directory /var/www/html/public/assets/img/subidas>
        php_admin_flag engine off
        <FilesMatch "\.(?!(?i:webp|jpe?g|png|gif)$)[^.]*$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Archivos ocultos y configuración de IIS
    <FilesMatch "(^\.|^web\.config$)">
        Require all denied
    </FilesMatch>

    # Las fotos y recursos llevan ?v=fecha en la dirección: se pueden guardar en caché mucho tiempo.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=2592000"
    </LocationMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
